services:
  - type: web
    name: social-media-agent
    env: docker
    dockerfilePath: deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
    regions:
      - frankfurt
    plan: starter
    autoDeploy: true
